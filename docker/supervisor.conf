[supervisord]
nodaemon=true

[program:laravel-scheduler]
command=/bin/sh -c "while [ true ]; do (php /var/www/html/artisan schedule:run --verbose --no-interaction &); sleep 60; done"
autostart=true
autorestart=true
user=root
redirect_stderr=true
stdout_logfile=/var/log/scheduler.log

; Inertia server-side rendering for the React pages. The web server reaches it at
; http://we-scheduler:13714 (INERTIA_SSR_URL in docker/.docker.env). It waits for
; `npm run build` to produce the bundle; after a rebuild, `php artisan inertia:stop-ssr`
; makes it exit and supervisor restarts it on the new bundle.
[program:inertia-ssr]
command=/bin/sh -c "until [ -f bootstrap/ssr/inertia.js ]; do sleep 5; done; exec php artisan inertia:start-ssr"
directory=/var/www/html
autostart=true
autorestart=true
user=root
redirect_stderr=true
stdout_logfile=/var/log/inertia-ssr.log
