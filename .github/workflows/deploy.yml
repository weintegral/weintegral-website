name: TestAndDeploy

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  executing-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.7.4.1
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: weintegral_website
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:2.11.3
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.deploy', '.env');"
      - name: Install Composer dependencies from lockfile
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.13.1"
      - name: Install, check and build front-end (Vite+)
        run: |
          npm ci
          npm run check
          npm run build
      - name: Generate key
        run: php artisan key:generate
      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache
      - name: Run Migrations
        run: php artisan migrate --force
      - name: Create Database
        run: |
          mkdir -p database
          touch database/database.sqlite
      - name: Execute tests (Unit and Feature tests) via PHPUnit
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: weintegral_website
          DB_USERNAME: root
          DB_PASSWORD: root
        run: vendor/bin/phpunit

  deploy:
    needs: [executing-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.PORT }}
          script: "cd /var/www/weintegral-website && chmod +x .scripts/deploy.sh && ./.scripts/deploy.sh"
